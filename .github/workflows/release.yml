name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    uses: JakobMelchard/.github/.github/workflows/release.yml@4258fca96cbd14e90054debed585f9cf8aad04f7 # v2.1.0
    with: { release-type: simple }
    # A called workflow cannot be granted more than the caller holds.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
