name: ci
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
jobs:
  shell:
    uses: JakobMelchard/.github/.github/workflows/shell.yml@531b4dcb30293e6219d67e312e164cc262a69955 # v2.3.1
    with:
      paths: .
      severity: warning
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: reject bash 4+ builtins
        run: test/portable
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      - name: install tools the tests exercise
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh
          npm install -g prettier@3.9.10 eslint@10.12.0
      - name: hook tests
        # swift-format has no Linux install here, so it is not required
        run: REQUIRE="zsh tofu prettier eslint go gofmt" test/run
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          extra-args: --all-files
